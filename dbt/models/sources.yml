# Use version 2 of dbt's YAML definition format; this is not the installed dbt software version.
version: 2
# List tables that our pipeline loads before dbt starts transforming them.
sources:
  # Give this group the alias used by source('retail_raw', 'ORDERS') in stg_orders.sql.
  - name: retail_raw
    # Read the database name from the environment; use RETAIL_DEMO if that setting is absent.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'RETAIL_DEMO') }}"
    # Tell dbt that the original loaded tables are in this Snowflake schema.
    schema: RAW
    # Start the list of tables available through the retail_raw alias.
    tables:
      # Match the real ORDERS table that Spark's loader fills in the RAW schema.
      - name: ORDERS
# Describe dbt-created models and the data-quality checks that dbt build must run.
models:
  # Match the SQL filename fact_orders.sql so these checks apply to its output table.
  - name: fact_orders
    # Explain the meaning of one output row for readers of dbt's documentation.
    description: One row per purchased product, incrementally merged by transaction ID.
    # Start the list of output columns that we want dbt to check.
    columns:
      # Select the purchase ID column, which identifies a purchase throughout the pipeline.
      - name: transaction_id
        # Fail the build if an ID is repeated or missing; either would make reporting unreliable.
        data_tests: [unique, not_null]
      # Select the calculated amount paid by the customer.
      - name: net_revenue
        # Fail the build if a reporting row has no revenue value.
        data_tests: [not_null]
      # Select the original purchase time used by the sales-over-time chart.
      - name: ordered_at
        # Fail the build if an order has no purchase time.
        data_tests: [not_null]
